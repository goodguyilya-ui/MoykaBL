<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Новая заявка</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./register.html">Регистрация</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="./create_application.html">Новая заявка</a>
      <a href="#" id="logoutLink">Выход</a>
    </div>

    <h1>Формирование заявки</h1>
    <form id="appForm" class="card">
      <div class="field">
        <label for="course_name">Курс</label>
        <select id="course_name" name="course_name" required>
          <option value="">Выберите курс</option>
          <option>Основы алгоритмизации и программирования</option>
          <option>Основы веб-дизайна</option>
          <option>Основы проектирования баз данных</option>
        </select>
      </div>

      <div class="field">
        <label for="car_model">Марка и модель автомобиля</label>
        <input id="car_model" name="car_model" required placeholder="Например, Kia Rio">
      </div>

      <div class="field">
        <label for="visit_date">Дата (ДД.ММ.ГГГГ)</label>
        <input id="visit_date" type="text" name="visit_date" required placeholder="31.12.2026" pattern="^\\d{2}\\.\\d{2}\\.\\d{4}$">
      </div>

      <div class="field">
        <label for="visit_time">Желаемое время</label>
        <input id="visit_time" type="time" name="visit_time" required>
      </div>

      <div class="field">
        <label for="payment_method">Способ оплаты</label>
        <select id="payment_method" name="payment_method" required>
          <option value="">Выберите способ</option>
          <option>Наличными</option>
          <option>Переводом по номеру телефона</option>
        </select>
      </div>

      <button type="submit">Отправить</button>
      <p id="msg" class="msg"></p>
    </form>
  </div>

  <script>
    function navigateTo(url) {
      if (!url) return;
      document.body.classList.add("page-leaving");
      window.setTimeout(() => {
        window.location.href = url;
      }, 180);
    }

    function setupPageTransitions() {
      window.requestAnimationFrame(() => {
        document.body.classList.add("page-ready");
      });
      document.querySelectorAll("a[href]").forEach((link) => {
        link.addEventListener("click", (e) => {
          const href = link.getAttribute("href") || "";
          if (!href || href.startsWith("#") || link.target === "_blank" || href.startsWith("http")) {
            return;
          }
          e.preventDefault();
          navigateTo(href);
        });
      });
    }

    setupPageTransitions();

    const form = document.getElementById("appForm");
    const msg = document.getElementById("msg");
    const logoutLink = document.getElementById("logoutLink");

    const userId = localStorage.getItem("carwash_current_user_id");
    function setMsg(text, type = "") {
      msg.className = type ? `msg ${type}` : "msg";
      msg.textContent = text || "";
    }

    if (!userId) {
      navigateTo("./login.html");
    }

    function toIsoDate(dateText) {
      const match = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(dateText);
      if (!match) {
        return null;
      }

      const [, dd, mm, yyyy] = match;
      const iso = `${yyyy}-${mm}-${dd}`;
      const parsed = new Date(`${iso}T00:00:00`);
      if (
        Number.isNaN(parsed.getTime()) ||
        parsed.getFullYear() !== Number(yyyy) ||
        parsed.getMonth() + 1 !== Number(mm) ||
        parsed.getDate() !== Number(dd)
      ) {
        return null;
      }
      return iso;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");

      if (!form.checkValidity()) {
        setMsg("Заполните обязательные поля.", "error");
        return;
      }

      const isoDate = toIsoDate(form.visit_date.value.trim());
      if (!isoDate) {
        setMsg("Дата должна быть в формате ДД.ММ.ГГГГ.", "error");
        form.visit_date.classList.add("is-error");
        return;
      }
      form.visit_date.classList.remove("is-error");

      const payload = {
        user_id: Number(localStorage.getItem("carwash_current_user_id")),
        course_name: form.course_name.value,
        car_model: form.car_model.value.trim(),
        visit_date: isoDate,
        visit_time: form.visit_time.value,
        payment_method: form.payment_method.value
      };

      try {
        const res = await fetch("./api/create_application", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg(data.error || "Ошибка создания заявки.", "error");
          return;
        }

        form.reset();
        setMsg("Заявка создана.", "ok");
      } catch {
        setMsg("Ошибка подключения к серверу.", "error");
      }
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("carwash_current_user_id");
      localStorage.removeItem("carwash_current_role");
      navigateTo("./login.html");
    });
  </script>
</body>
</html>
