<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Регистрация</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./register.html">Регистрация</a>
    </div>

    <h1>Регистрация клиента</h1>
    <form id="regForm" class="card">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" required minlength="6" pattern="^[A-Za-z0-9]{6,}$" placeholder="Латиница и цифры">
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="Минимум 8 символов">
      </div>

      <div class="field">
        <label for="full_name">ФИО</label>
        <input id="full_name" name="full_name" required pattern="^[А-Яа-яЁё\\s]+$" placeholder="Иванов Иван Иванович">
      </div>

      <div class="field">
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" required pattern="^8\\(\\d{3}\\)\\d{3}-\\d{2}-\\d{2}$" placeholder="8(999)123-45-67">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="name@example.com">
      </div>

      <div class="actions">
        <button type="submit">Создать пользователя</button>
      </div>
      <p id="msg" class="msg"></p>
      <p class="muted"><a href="./login.html">Уже зарегистрированы? Войти</a></p>
    </form>
  </div>

  <script>
    function navigateTo(url) {
      if (!url) return;
      document.body.classList.add("page-leaving");
      window.setTimeout(() => {
        window.location.href = url;
      }, 180);
    }

    function setupPageTransitions() {
      window.requestAnimationFrame(() => {
        document.body.classList.add("page-ready");
      });
      document.querySelectorAll("a[href]").forEach((link) => {
        link.addEventListener("click", (e) => {
          const href = link.getAttribute("href") || "";
          if (!href || href.startsWith("#") || link.target === "_blank" || href.startsWith("http")) {
            return;
          }
          e.preventDefault();
          navigateTo(href);
        });
      });
    }

    setupPageTransitions();

    const form = document.getElementById("regForm");
    const msg = document.getElementById("msg");
    function setMsg(text, type = "") {
      msg.className = type ? `msg ${type}` : "msg";
      msg.textContent = text || "";
    }

    const fields = Array.from(form.querySelectorAll("input"));

    function clearFieldError(input) {
      input.classList.remove("is-error");
      const errorEl = input.parentElement.querySelector(".field-error");
      if (errorEl) {
        errorEl.remove();
      }
    }

    function setFieldError(input, text) {
      clearFieldError(input);
      input.classList.add("is-error");
      const errorEl = document.createElement("p");
      errorEl.className = "field-error";
      errorEl.textContent = text;
      input.parentElement.appendChild(errorEl);
    }

    function validateForm() {
      let hasError = false;
      fields.forEach((input) => {
        clearFieldError(input);
        if (input.validity.valid) {
          return;
        }

        hasError = true;
        if (input.validity.valueMissing) {
          setFieldError(input, "Поле обязательно для заполнения.");
          return;
        }
        if (input.id === "login") {
          setFieldError(input, "Логин: от 6 символов, только латиница и цифры.");
          return;
        }
        if (input.id === "password") {
          setFieldError(input, "Пароль должен содержать минимум 8 символов.");
          return;
        }
        if (input.id === "full_name") {
          setFieldError(input, "ФИО: только русские буквы и пробелы.");
          return;
        }
        if (input.id === "phone") {
          setFieldError(input, "Формат телефона: 8(999)123-45-67.");
          return;
        }
        if (input.id === "email") {
          setFieldError(input, "Введите корректный email.");
        }
      });

      return !hasError;
    }

    fields.forEach((input) => {
      input.addEventListener("input", () => {
        if (input.validity.valid) {
          clearFieldError(input);
        }
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");

      if (!validateForm()) {
        setMsg("Проверьте корректность заполнения формы.", "error");
        return;
      }

      const payload = {
        login: form.login.value.trim(),
        password: form.password.value,
        full_name: form.full_name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim().toLowerCase()
      };

      try {
        const res = await fetch("./api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg(data.error || "Ошибка регистрации.", "error");
          return;
        }

        form.reset();
        setMsg("Пользователь создан. Теперь можно войти.", "ok");
      } catch {
        setMsg("Ошибка подключения к серверу.", "error");
      }
    });
  </script>
</body>
</html>
