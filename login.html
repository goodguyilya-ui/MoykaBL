<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Вход</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./register.html">Регистрация</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="./create_application.html">Новая заявка</a>
      <a href="./admin.html">Админка</a>
    </div>

    <h1>Авторизация</h1>
    <form id="loginForm" class="card">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div class="actions">
        <button type="submit">Войти</button>
      </div>
      <p id="msg" class="msg"></p>
      <p class="muted">Администратор: логин <b>Admin</b>, пароль <b>KorokNET</b>.</p>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");

    const existingRole = localStorage.getItem("carwash_current_role");
    if (existingRole === "admin") {
      window.location.href = "./admin.html";
    } else if (existingRole === "client") {
      window.location.href = "./applications.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      try {
        const res = await fetch("./api/login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login: form.login.value.trim(),
            password: form.password.value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || "Ошибка авторизации.";
          msg.classList.add("error");
          return;
        }

        localStorage.setItem("carwash_current_user_id", String(data.user_id));
        localStorage.setItem("carwash_current_role", data.role);
        msg.textContent = "Вход выполнен.";
        msg.classList.add("ok");

        if (data.role === "admin") {
          window.location.href = "./admin.html";
        } else {
          window.location.href = "./applications.html";
        }
      } catch {
        msg.textContent = "Ошибка подключения к серверу.";
        msg.classList.add("error");
      }
    });
  </script>
</body>
</html>
