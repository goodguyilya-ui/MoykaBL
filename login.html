<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Вход</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./register.html">Регистрация</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="./create_application.html">Новая заявка</a>
      <a href="./admin.html">Админка</a>
    </div>

    <div class="slider" id="slider">
      <div class="slides">
        <img class="slide is-active" src="https://i.postimg.cc/Dy3s0K7x/slide-01-webp.jpg" alt="Слайд 1">
        <img class="slide" src="https://i.postimg.cc/8PgWcVTK/slide-02-webp.jpg" alt="Слайд 2">
        <img class="slide" src="https://i.postimg.cc/SNb8Rpmt/slide-03-webp.jpg" alt="Слайд 3">
        <img class="slide" src="https://i.postimg.cc/wTYJMd94/slide-04-webp.jpg" alt="Слайд 4">
      </div>
      <button class="slider-btn prev" type="button">&#10094;</button>
      <button class="slider-btn next" type="button">&#10095;</button>
    </div>

    <h1>Авторизация</h1>
    <form id="loginForm" class="card">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div class="actions">
        <button type="submit">Войти</button>
      </div>
      <p id="msg" class="msg"></p>
      <p class="muted"><a href="./register.html">Еще не зарегистрированы? Регистрация</a></p>
      <p class="muted">Администратор: логин <b>Admin</b>, пароль <b>KorokNET</b>.</p>
    </form>
  </div>

  <script src="./slider.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");
    function setMsg(text, type = "") {
      msg.className = type ? `msg ${type}` : "msg";
      msg.textContent = text || "";
    }

    const apiBases = ["./api", "../api", "../backend/api", "/korochki_carwash/api"];

    async function apiPost(endpoint, payload) {
      let lastError = null;
      for (const base of apiBases) {
        try {
          const res = await fetch(`${base}/${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          return { res, data };
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error("API недоступно");
    }

    const existingRole = localStorage.getItem("carwash_current_role");
    if (existingRole === "admin") {
      window.location.href = "./admin.html";
    } else if (existingRole === "client") {
      window.location.href = "./applications.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");
      try {
        const { res, data } = await apiPost("login.php", {
          login: form.login.value.trim(),
          password: form.password.value
        });
        if (!res.ok) {
          setMsg(data.error || "Ошибка авторизации.", "error");
          return;
        }

        localStorage.setItem("carwash_current_user_id", String(data.user_id));
        localStorage.setItem("carwash_current_role", data.role);
        setMsg("Вход выполнен.", "ok");

        if (data.role === "admin") {
          window.location.href = "./admin.html";
        } else {
          window.location.href = "./applications.html";
        }
      } catch {
        setMsg("Ошибка подключения к серверу.", "error");
      }
    });
  </script>
</body>
</html>
