<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Панель администратора</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./admin.html">Админка</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="#" id="logoutLink">Выход</a>
    </div>

    <h1>Панель администратора</h1>
    <p class="muted">Доступно только для роли admin.</p>
    <div class="card">
      <div class="field">
        <label for="statusFilter">Фильтр по статусу</label>
        <select id="statusFilter">
          <option value="">Все статусы</option>
          <option value="Новая">Новая</option>
          <option value="Идёт обучение">Идёт обучение</option>
          <option value="Обучение завершено">Обучение завершено</option>
        </select>
      </div>
      <div class="field">
        <label for="searchInput">Поиск по услуге или авто</label>
        <input id="searchInput" type="text" placeholder="Например, Kia или Комплексная">
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Пользователь ID</th>
            <th>Курс</th>
            <th>Авто</th>
            <th>Дата/время</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="appsTbody"></tbody>
      </table>
    </div>

    <div class="pagination card" style="margin-top: 0;">
      <button id="prevPageBtn" type="button">Назад</button>
      <span id="pageInfo">Страница 1</span>
      <button id="nextPageBtn" type="button">Вперёд</button>
    </div>
    <p id="msg" class="msg"></p>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const tbody = document.getElementById("appsTbody");
    const logoutLink = document.getElementById("logoutLink");
    const statusFilter = document.getElementById("statusFilter");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const pageInfo = document.getElementById("pageInfo");
    const msg = document.getElementById("msg");
    const role = localStorage.getItem("carwash_current_role");
    const pageSize = 5;
    let currentPage = 1;

    function setMsg(text, type = "") {
      msg.className = type ? `msg ${type}` : "msg";
      msg.textContent = text || "";
    }

    function showToast(text, isError = false) {
      toast.textContent = text;
      toast.style.background = isError ? "#b42318" : "#1d2939";
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    if (role !== "admin") {
      window.location.href = "./login.html";
    }

    async function render() {
      try {
        const res = await fetch("./api/get_admin_applications.php");
        const data = await res.json();
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="6">${data.error || "Ошибка загрузки заявок."}</td></tr>`;
          setMsg(data.error || "Ошибка загрузки заявок.", "error");
          return;
        }

        const apps = data.items || [];
        const statusValue = statusFilter.value;
        const query = searchInput.value.trim().toLowerCase();
        const filtered = apps.filter((app) => {
          const byStatus = !statusValue || app.status === statusValue;
          const haystack = `${app.course_name} ${app.car_model}`.toLowerCase();
          const byQuery = !query || haystack.includes(query);
          return byStatus && byQuery;
        });

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="6">Заявок пока нет.</td></tr>';
          pageInfo.textContent = "Страница 0 из 0";
          prevPageBtn.disabled = true;
          nextPageBtn.disabled = true;
          return;
        }

        const totalPages = Math.ceil(filtered.length / pageSize);
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * pageSize;
        const paged = filtered.slice(start, start + pageSize);

        pageInfo.textContent = `Страница ${currentPage} из ${totalPages}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages;

        tbody.innerHTML = paged.map((a) => `
          <tr>
            <td>${a.id}</td>
            <td>${a.user_id}</td>
            <td>${a.course_name}</td>
            <td>${a.car_model}</td>
            <td>${a.visit_date} ${a.visit_time}</td>
            <td>
              <select data-id="${a.id}">
                <option ${a.status === "Новая" ? "selected" : ""}>Новая</option>
                <option ${a.status === "Идёт обучение" ? "selected" : ""}>Идёт обучение</option>
                <option ${a.status === "Обучение завершено" ? "selected" : ""}>Обучение завершено</option>
              </select>
            </td>
          </tr>
        `).join("");

        tbody.querySelectorAll("select").forEach((sel) => {
          sel.addEventListener("change", async () => {
            try {
              const updRes = await fetch("./api/update_application_status.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  application_id: Number(sel.dataset.id),
                  status: sel.value
                })
              });
              if (!updRes.ok) {
                showToast("Не удалось обновить статус.", true);
                setMsg("Не удалось обновить статус.", "error");
                render();
                return;
              }
              showToast("Статус обновлён.");
              setMsg("Статус обновлён.", "ok");
            } catch {
              showToast("Ошибка подключения к серверу.", true);
              setMsg("Ошибка подключения к серверу.", "error");
              render();
            }
          });
        });
        setMsg("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="6">Ошибка подключения к серверу.</td></tr>';
        setMsg("Ошибка подключения к серверу.", "error");
      }
    }

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("carwash_current_user_id");
      localStorage.removeItem("carwash_current_role");
      window.location.href = "./login.html";
    });

    statusFilter.addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    searchInput.addEventListener("input", () => {
      currentPage = 1;
      render();
    });
    prevPageBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        render();
      }
    });
    nextPageBtn.addEventListener("click", () => {
      currentPage += 1;
      render();
    });

    render();
  </script>
</body>
</html>
