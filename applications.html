<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Мои заявки</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./create_application.html">Новая заявка</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="#" id="logoutLink">Выход</a>
    </div>

    <h1>Мои заявки</h1>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Курс</th>
            <th>Авто</th>
            <th>Дата/время</th>
            <th>Оплата</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="appsTbody"></tbody>
      </table>
    </div>

    <h2 style="margin-top: 20px;">Оставить отзыв</h2>
    <p id="reviewHint" class="muted">Отзыв будет доступен после получения статуса "Обучение завершено".</p>
    <form id="reviewForm" class="card">
      <div class="field">
        <label for="review_text">Текст отзыва</label>
        <textarea id="review_text" name="review_text" required></textarea>
      </div>
      <button type="submit">Отправить отзыв</button>
      <p id="msg" class="msg"></p>
    </form>
  </div>

  <script>
    function navigateTo(url) {
      if (!url) return;
      document.body.classList.add("page-leaving");
      window.setTimeout(() => {
        window.location.href = url;
      }, 180);
    }

    function setupPageTransitions() {
      window.requestAnimationFrame(() => {
        document.body.classList.add("page-ready");
      });
      document.querySelectorAll("a[href]").forEach((link) => {
        link.addEventListener("click", (e) => {
          const href = link.getAttribute("href") || "";
          if (!href || href.startsWith("#") || link.target === "_blank" || href.startsWith("http")) {
            return;
          }
          e.preventDefault();
          navigateTo(href);
        });
      });
    }

    setupPageTransitions();

    const tbody = document.getElementById("appsTbody");
    const reviewForm = document.getElementById("reviewForm");
    const msg = document.getElementById("msg");
    const logoutLink = document.getElementById("logoutLink");
    const reviewHint = document.getElementById("reviewHint");
    const reviewText = document.getElementById("review_text");
    const reviewButton = reviewForm.querySelector("button[type='submit']");
    let canSendReview = false;

    function setMsg(text, type = "") {
      msg.className = type ? `msg ${type}` : "msg";
      msg.textContent = text || "";
    }

    const currentUserId = Number(localStorage.getItem("carwash_current_user_id"));
    if (!currentUserId) {
      navigateTo("./login.html");
    }

    async function render() {
      try {
        const res = await fetch(`./api/get_user_applications?user_id=${currentUserId}`);
        const data = await res.json();
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="6">${data.error || "Ошибка загрузки заявок."}</td></tr>`;
          return;
        }

        const rows = data.items || [];
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="6">Пока нет заявок.</td></tr>';
          canSendReview = false;
          reviewText.disabled = true;
          reviewButton.disabled = true;
          reviewHint.textContent = 'У вас пока нет заявок. Отзыв станет доступен после статуса "Обучение завершено".';
          return;
        }

        tbody.innerHTML = rows.map((r) => `
          <tr>
            <td>${r.id}</td>
            <td>${r.course_name}</td>
            <td>${r.car_model}</td>
            <td>${r.visit_date} ${r.visit_time}</td>
            <td>${r.payment_method}</td>
            <td>${r.status}</td>
          </tr>
        `).join("");

        canSendReview = rows.some((r) => r.status === "Обучение завершено");
        reviewText.disabled = !canSendReview;
        reviewButton.disabled = !canSendReview;
        reviewHint.textContent = canSendReview
          ? "Статус выполнен. Теперь можно оставить отзыв."
          : 'Форма отзыва недоступна до статуса "Обучение завершено".';
      } catch {
        tbody.innerHTML = '<tr><td colspan="6">Ошибка подключения к серверу.</td></tr>';
        canSendReview = false;
        reviewText.disabled = true;
        reviewButton.disabled = true;
      }
    }

    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");
      if (!canSendReview) {
        setMsg('Отзыв можно оставить только после статуса "Обучение завершено".', "error");
        return;
      }

      const text = reviewForm.review_text.value.trim();
      if (!text) {
        setMsg("Отзыв не должен быть пустым.", "error");
        return;
      }

      try {
        const res = await fetch("./api/create_review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: currentUserId,
            text
          })
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg(data.error || "Ошибка отправки отзыва.", "error");
          return;
        }

        reviewForm.reset();
        setMsg("Отзыв отправлен.", "ok");
      } catch {
        setMsg("Ошибка подключения к серверу.", "error");
      }
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("carwash_current_user_id");
      localStorage.removeItem("carwash_current_role");
      navigateTo("./login.html");
    });

    render();
  </script>
</body>
</html>
