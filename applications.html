<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомойка - Мои заявки</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="./login.html">Вход</a>
      <a href="./create_application.html">Новая заявка</a>
      <a href="./applications.html">Мои заявки</a>
      <a href="#" id="logoutLink">Выход</a>
    </div>

    <h1>Мои заявки</h1>
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Услуга</th>
          <th>Авто</th>
          <th>Дата/время</th>
          <th>Оплата</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="appsTbody"></tbody>
    </table>

    <h2 style="margin-top: 20px;">Оставить отзыв</h2>
    <form id="reviewForm" class="card">
      <div class="field">
        <label for="review_text">Текст отзыва</label>
        <textarea id="review_text" name="review_text" required></textarea>
      </div>
      <button type="submit">Отправить отзыв</button>
      <p id="msg" class="msg"></p>
    </form>
  </div>

  <script>
    const tbody = document.getElementById("appsTbody");
    const reviewForm = document.getElementById("reviewForm");
    const msg = document.getElementById("msg");
    const logoutLink = document.getElementById("logoutLink");

    const currentUserId = Number(localStorage.getItem("carwash_current_user_id"));
    if (!currentUserId) {
      window.location.href = "./login.html";
    }

    async function render() {
      try {
        const res = await fetch(`./api/get_user_applications.php?user_id=${currentUserId}`);
        const data = await res.json();
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="6">${data.error || "Ошибка загрузки заявок."}</td></tr>`;
          return;
        }

        const rows = data.items || [];
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="6">Пока нет заявок.</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map((r) => `
          <tr>
            <td>${r.id}</td>
            <td>${r.service_name}</td>
            <td>${r.car_model}</td>
            <td>${r.visit_date} ${r.visit_time}</td>
            <td>${r.payment_method}</td>
            <td>${r.status}</td>
          </tr>
        `).join("");
      } catch {
        tbody.innerHTML = '<tr><td colspan="6">Ошибка подключения к серверу.</td></tr>';
      }
    }

    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";

      const text = reviewForm.review_text.value.trim();
      if (!text) {
        msg.textContent = "Отзыв не должен быть пустым.";
        msg.classList.add("error");
        return;
      }

      try {
        const res = await fetch("./api/create_review.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: currentUserId,
            text
          })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || "Ошибка отправки отзыва.";
          msg.classList.add("error");
          return;
        }

        reviewForm.reset();
        msg.textContent = "Отзыв отправлен.";
        msg.classList.add("ok");
      } catch {
        msg.textContent = "Ошибка подключения к серверу.";
        msg.classList.add("error");
      }
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("carwash_current_user_id");
      localStorage.removeItem("carwash_current_role");
      window.location.href = "./login.html";
    });

    render();
  </script>
</body>
</html>
